[package]
name = "coolit"
version = "0.1.0"
edition = "2024"
description = "make files cool by splitting them!"
license = "MIT"
authors = ["GennaroBiondi"]
repository = "https://github.com/GennaroBiondi/coolit"
readme = "README.md"
keywords = ["utility", "cli", "file", "split", "chunk"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
